<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>radar — dashboard</title>
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>
<div class="topbar">
  <div class="brand">
    <span class="pulse" aria-hidden="true"></span>
    <h1>radar<span class="sub">/ local dashboard</span></h1>
  </div>
  <div class="topbar-right">
    <label class="toggle">
      <input type="checkbox" id="autoRefresh" checked>
      <span>auto-refresh</span>
    </label>
    <span class="refresh" id="refresh">—</span>
  </div>
</div>
<div class="stats" id="stats"></div>

<h2>Leaderboard <span class="muted" id="lb-count"></span>
  <input class="tbl-search" data-table="leaderboard" placeholder="filter…">
</h2>
<div class="table-wrap"><table data-table="leaderboard"><thead><tr>
  <th class="rank">#</th>
  <th data-key="id" data-type="num">id</th>
  <th data-key="round_id" data-type="num">round</th>
  <th data-key="miner_id">miner</th>
  <th data-key="name">name</th>
  <th class="num" data-key="metric" data-type="num">metric</th>
  <th class="num" data-key="objectives.crps" data-type="num">crps</th>
  <th class="num" data-key="objectives.mase" data-type="num">mase</th>
  <th class="num" data-key="objectives.flops_equivalent_size" data-type="num">flops</th>
  <th class="num" data-key="score" data-type="num">score</th>
</tr></thead><tbody id="leaderboard"></tbody></table></div>

<h2>Pareto frontier (metric × flops)
  <button class="chart-expand" data-chart="pareto" title="enlarge">⤢</button>
  <input class="tbl-search" data-table="frontier" placeholder="filter…">
</h2>
<div class="chart-host"><canvas id="pareto" width="900" height="320"></canvas></div>
<div class="table-wrap"><table data-table="frontier"><thead><tr>
  <th data-key="id" data-type="num">id</th>
  <th data-key="miner_id">miner</th>
  <th class="num" data-key="objectives.flops_equivalent_size" data-type="num">flops</th>
  <th class="num" data-key="metric" data-type="num">metric</th>
  <th class="num" data-key="objectives.crps" data-type="num">crps</th>
  <th class="num" data-key="objectives.mase" data-type="num">mase</th>
</tr></thead><tbody id="frontier"></tbody></table></div>

<h2>Pareto frontier (crps × mase) <span class="muted" id="cm-count"></span>
  <button class="chart-expand" data-chart="paretoCM" title="enlarge">⤢</button>
  <input class="tbl-search" data-table="frontierCM" placeholder="filter…">
</h2>
<div class="chart-host"><canvas id="paretoCM" width="900" height="320"></canvas></div>
<div class="table-wrap"><table data-table="frontierCM"><thead><tr>
  <th data-key="id" data-type="num">id</th>
  <th data-key="miner_id">miner</th>
  <th data-key="name">name</th>
  <th class="num" data-key="objectives.crps" data-type="num">crps</th>
  <th class="num" data-key="objectives.mase" data-type="num">mase</th>
  <th class="num" data-key="objectives.flops_equivalent_size" data-type="num">flops</th>
</tr></thead><tbody id="frontierCM"></tbody></table></div>

<h2>Recent
  <input class="tbl-search" data-table="recent" placeholder="filter…">
</h2>
<div class="table-wrap"><table data-table="recent"><thead><tr>
  <th data-key="id" data-type="num">id</th>
  <th data-key="round_id" data-type="num">round</th>
  <th data-key="miner_id">miner</th>
  <th data-key="name">name</th>
  <th class="num" data-key="metric" data-type="num">metric</th>
  <th class="num" data-key="score" data-type="num">score</th>
  <th data-key="success">ok</th>
</tr></thead><tbody id="recent"></tbody></table></div>

<div id="tooltip" class="tooltip"></div>
<div id="detail"></div>
<div id="modal" class="modal"><div class="modal-inner">
  <div class="modal-head">
    <span id="modalTitle"></span>
    <span class="close" id="modalClose">×</span>
  </div>
  <div id="modalBody"></div>
</div></div>

<script src="/dashboard.js"></script>
</body></html>
