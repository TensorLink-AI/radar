<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>radar — dashboard</title>
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>
<div class="topbar">
  <div class="brand">
    <span class="pulse" aria-hidden="true"></span>
    <h1>radar<span class="sub">/ local dashboard</span></h1>
  </div>
  <div class="topbar-right">
    <label class="toggle">
      <input type="checkbox" id="autoRefresh" checked>
      <span>auto-refresh</span>
    </label>
    <span class="refresh" id="refresh">—</span>
  </div>
</div>
<div class="stats" id="stats"></div>

<h2>Leaderboard <span class="muted" id="lb-count"></span></h2>
<div class="table-wrap"><table><thead><tr>
  <th class="rank">#</th><th>id</th><th>round</th><th>miner</th><th>name</th>
  <th class="num">metric</th><th class="num">crps</th><th class="num">mase</th>
  <th class="num">flops</th><th class="num">score</th>
</tr></thead><tbody id="leaderboard"></tbody></table></div>

<h2>Pareto frontier (metric × flops)
  <button class="chart-expand" data-chart="pareto" title="enlarge">⤢</button>
</h2>
<div class="chart-host"><canvas id="pareto" width="900" height="320"></canvas></div>
<div class="table-wrap"><table><thead><tr>
  <th>id</th><th>miner</th><th class="num">flops</th>
  <th class="num">metric</th><th class="num">crps</th><th class="num">mase</th>
</tr></thead><tbody id="frontier"></tbody></table></div>

<h2>Pareto frontier (crps × mase) <span class="muted" id="cm-count"></span>
  <button class="chart-expand" data-chart="paretoCM" title="enlarge">⤢</button>
</h2>
<div class="chart-host"><canvas id="paretoCM" width="900" height="320"></canvas></div>
<div class="table-wrap"><table><thead><tr>
  <th>id</th><th>miner</th><th>name</th>
  <th class="num">crps</th><th class="num">mase</th><th class="num">flops</th>
</tr></thead><tbody id="frontierCM"></tbody></table></div>

<h2>Recent</h2>
<div class="table-wrap"><table><thead><tr>
  <th>id</th><th>round</th><th>miner</th><th>name</th>
  <th class="num">metric</th><th class="num">score</th><th>ok</th>
</tr></thead><tbody id="recent"></tbody></table></div>

<div id="tooltip" class="tooltip"></div>
<div id="detail"></div>
<div id="modal" class="modal"><div class="modal-inner">
  <div class="modal-head">
    <span id="modalTitle"></span>
    <span class="close" id="modalClose">×</span>
  </div>
  <div id="modalBody"></div>
</div></div>

<script src="/dashboard.js"></script>
</body></html>
